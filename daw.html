<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForgeAI Music - DAW</title>
    <link rel="stylesheet" href="daw.css">
</head>
<body>
    <div class="daw-container">
        <!-- Top Menu Bar -->
        <div class="menu-bar">
            <div class="menu-items">
                <a href="index.html" class="menu-item" style="text-decoration: none; color: inherit;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 4px;">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                    </svg>
                    HOME
                </a>
                <span class="menu-item">FILE</span>
                <span class="menu-item">EDIT</span>
                <span class="menu-item">ADD</span>
                <span class="menu-item">PATTERNS</span>
                <span class="menu-item">VIEW</span>
                <span class="menu-item">OPTIONS</span>
                <span class="menu-item">TOOLS</span>
                <span class="menu-item">HELP</span>
            </div>
        </div>

        <!-- Transport Controls Bar -->
        <div class="transport-bar">
            <div class="transport-left">
                <button class="transport-btn" id="saveBtn" title="Save">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
                    </svg>
                </button>
                <button class="transport-btn" id="openBtn" title="Open">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-1 12H5V8h14v10z"/>
                    </svg>
                </button>
            </div>

            <div class="transport-center">
                <button class="transport-btn" id="stopBtn" title="Stop">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12"/>
                    </svg>
                </button>
                <button class="transport-btn primary" id="playBtn" title="Play">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>
                <button class="transport-btn record" id="recordBtn" title="Record">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="8"/>
                    </svg>
                </button>
                
                <div class="tempo-control">
                    <input type="number" id="tempoInput" value="140" min="40" max="300">
                    <span class="tempo-label">BPM</span>
                </div>
            </div>

            <div class="transport-right">
                <div class="time-display" id="timeDisplay">0:00:00</div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Left Panel - Tools -->
            <div class="left-panel">
                <div class="tool-section">
                    <button class="tool-btn active" title="Select">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 2l10 10-4 4-4-4-2 8-2-2 8-2-4-4z"/>
                        </svg>
                    </button>
                    <button class="tool-btn" title="Pencil">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                        </svg>
                    </button>
                    <button class="tool-btn" title="Eraser">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16.24 3.56l4.95 4.94c.78.79.78 2.05 0 2.84L12 20.53a4.008 4.008 0 0 1-5.66 0L2.81 17c-.78-.79-.78-2.05 0-2.84l10.6-10.6c.79-.78 2.05-.78 2.83 0M4.22 15.58l3.54 3.53c.78.79 2.04.79 2.83 0l3.53-3.53-4.95-4.95-4.95 4.95z"/>
                        </svg>
                    </button>
                    <button class="tool-btn" title="Mute">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                        </svg>
                    </button>
                    <button class="tool-btn" title="Cut">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M9.64 7.64c.23-.5.36-1.05.36-1.64 0-2.21-1.79-4-4-4S2 3.79 2 6s1.79 4 4 4c.59 0 1.14-.13 1.64-.36L10 12l-2.36 2.36C7.14 14.13 6.59 14 6 14c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4c0-.59-.13-1.14-.36-1.64L12 14l7 7h3v-1L9.64 7.64zM6 8c-1.1 0-2-.89-2-2s.9-2 2-2 2 .89 2 2-.9 2-2 2zm0 12c-1.1 0-2-.89-2-2s.9-2 2-2 2 .89 2 2-.9 2-2 2zm6-7.5c-.28 0-.5-.22-.5-.5s.22-.5.5-.5.5.22.5.5-.22.5-.5.5zM19 3l-6 6 2 2 7-7V3z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Center Panel - Pattern Editor -->
            <div class="center-panel">
                <div class="pattern-header">
                    <div class="pattern-info">
                        <span class="pattern-label">Playlist - Arrangement › Pattern 1</span>
                    </div>
                </div>

                <div class="pattern-editor">
                    <!-- Track List -->
                    <div class="track-list">
                        <div class="track-header">
                            <button class="add-track-btn" id="addTrackBtn">+</button>
                        </div>
                        <div id="trackListContainer">
                            <!-- Tracks will be dynamically added here -->
                        </div>
                    </div>

                    <!-- Grid Area -->
                    <div class="grid-container">
                        <div class="grid-header" id="gridHeader">
                            <!-- Measure numbers will be added here -->
                        </div>
                        <div class="grid-content" id="gridContent">
                            <!-- Grid cells will be added here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Properties -->
            <div class="right-panel">
                <div class="panel-section">
                    <h3>Track Properties</h3>
                    <div class="property-group">
                        <label>Volume</label>
                        <input type="range" min="0" max="100" value="80" class="slider" id="volumeSlider">
                        <span id="volumeValue">80%</span>
                    </div>
                    <div class="property-group">
                        <label>Pan</label>
                        <input type="range" min="-100" max="100" value="0" class="slider" id="panSlider">
                        <span id="panValue">Center</span>
                    </div>
                    <div class="property-group">
                        <label>Track Name</label>
                        <input type="text" id="trackNameInput" placeholder="Track 1" class="text-input">
                    </div>
                </div>

                <div class="panel-section">
                    <h3>AI Generation</h3>
                    <button class="ai-btn" id="aiGenerateBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        Generate with AI
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="daw.js"></script>
</body>
</html>
